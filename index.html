<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MWP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
     <link href="styles.css" rel="stylesheet">
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"> 
</head>
<body>
    
        <header>
                <div class="searchingPanel" id="searchingPanel">
                    <input class="searchingInput" id="searchingInput" type="search" placeholder="Vyhledat geodetický bod" autocomplete="off">
                    <!--<button class="searchBtn" id="searchBtn" type="submit">
                        <svg viewBox="0 0 22 22" width="20" height="20">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
                            <line x1="16" y1="16" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button> -->
                    <ul class="searchingPointsList" id="searchingPointsList"></ul> 
                </div>
        </header>


        <main>
            <div id="map">
            <section class="information">
                <button class="infBtn" id="infBtn" type="button">i</button>
                <div class="infPanel" id="infPanel">
                    <div class="currentZone" id="currentZone">Aktuální zóna: načítání...</div>
                    <div class="straightDistanceResult" id="straightDistanceResult"><p></P>Přímá vzdálenost (<em>bod</em>): --</p></div>
                    <div class="rasterDistanceResult" id="straightDistanceResult"><p>Raster vzdálenost (<em>bod</em>): --</p></div>
                    <div class="gpsAccuracy" id="gpsAccuracy"><p>GPS přesnost: načítání...</p></div>
                </div>
            </section>
            <button type="button" class="selectedPointsBtn" id="selectedPointsBtn"></button>
                
                <div class="uiButtons">
                    <button class = "uiBtn panormaBtn" id="gpsBtn" type="button">
                        <svg width="24" height="24" viewBox="0 0 23 21" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <line x1="12" y1="2" x2="12" y2="6"/>
                            <line x1="12" y1="18" x2="12" y2="22"/>
                            <line x1="2" y1="12" x2="6" y2="12"/>
                            <line x1="18" y1="12" x2="22" y2="12"/>
                        </svg>
                    </button>
                    <button class = "uiBtn panoramBtn" id="panoramaBtn" type="button"><p>360°</p></button>
                </div>
            </div>
        </main>
            

        <footer>
            <nav class="menu">
                    <button class="navBtn" id="layersBtn" type="button">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M12 3 3 8l9 5 9-5-9-5Z"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linejoin="round"/>
                            <path d="M3 12l9 5 9-5"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linejoin="round"/>
                            </svg>
                    </button>
                    
                    <button class="navBtn" id="supportBtn" type="button">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <circle cx="12" cy="12" r="10"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"/>

                            <path d="M10 9.5a2.5 2.5 0 1 1 3.5 2.3c-.9.4-1.5.9-1.5 2.2"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"/>

                            <circle cx="12" cy="17.5" r="1"
                                    fill="currentColor"/>

                        </svg>
                    </button>

                    <button class="navBtn" id="settingsBtn" type="button">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <circle cx="12" cy="12" r="3"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"/>

                            <path d="M12 3v2.5M12 18.5V21
                                    M5.6 5.6l1.8 1.8
                                    M16.6 16.6l1.8 1.8
                                    M3 12h2.5
                                    M18.5 12H21
                                    M5.6 18.4l1.8-1.8
                                    M16.6 7.4l1.8-1.8"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"/>
                        </svg>
                    </button>
            </nav>
        </footer>
    <script src="app.js"></script>
</body>
</html>
